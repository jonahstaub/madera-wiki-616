<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Texting - The School Wiki</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="chat-login-screen" class="login-screen" aria-labelledby="chat-login-title">
        <div class="login-panel">
          <p class="eyebrow">Private class space</p>
          <h1 id="chat-login-title">Texting</h1>
          <p class="intro">Log in with your school wiki account and the shared class password.</p>
          <form id="chat-login-form" class="login-form">
            <label for="chat-account-name">Name</label>
            <input id="chat-account-name" type="text" autocomplete="name" maxlength="40" />
            <label for="chat-account-email">Email</label>
            <input id="chat-account-email" type="email" autocomplete="email" required />
            <label for="chat-account-password">Account password</label>
            <input id="chat-account-password" type="password" autocomplete="current-password" required />
            <label for="chat-password">Shared password</label>
            <div class="password-row">
              <input id="chat-password" type="password" required />
              <button type="submit" data-action="login">Log in</button>
            </div>
            <button type="submit" class="secondary-button" data-action="signup">Create account</button>
            <button id="chat-google-login-button" type="button" class="secondary-button">Sign in with Google</button>
            <p id="chat-login-error" class="error" role="alert"></p>
          </form>
        </div>
      </section>

      <section id="texting-screen" class="wiki-screen hidden" aria-label="Texting page">
        <header class="site-header">
          <div>
            <p class="eyebrow">The School Wiki</p>
            <h1>Texting</h1>
          </div>
          <nav class="header-actions" aria-label="Site navigation">
            <span id="chat-account-status" class="admin-status">Signed out</span>
            <a class="nav-button" href="index.html">Wiki</a>
            <button id="chat-lock-button" class="secondary-button" type="button">Lock</button>
          </nav>
        </header>

        <section class="texting-layout">
          <article class="texting-panel" aria-labelledby="messages-title">
            <div class="panel-heading">
              <h2 id="messages-title">Messages</h2>
            </div>
            <div id="messages-list" class="messages-list" aria-live="polite"></div>
          </article>

          <aside class="composer-panel texting-composer" aria-labelledby="message-form-title">
            <h2 id="message-form-title">Send a text</h2>
            <form id="message-form" class="stacked-form">
              <label>
                Your name
                <input id="message-author" type="text" maxlength="40" required />
              </label>
              <label>
                Message
                <textarea id="message-body" rows="5" maxlength="500" required></textarea>
              </label>
              <p id="message-error" class="form-note" role="alert"></p>
              <button type="submit">Send</button>
            </form>
          </aside>
        </section>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="dist/chat.js"></script>
  </body>
</html>
